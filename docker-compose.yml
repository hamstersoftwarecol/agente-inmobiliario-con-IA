services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inmovoz
    ports:
      - "5432:5432"
    volumes:
      - inmovoz-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inmovoz"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  inmovoz-db:
